<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Forgive Me, Yana ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hearts"></div>

  <main class="card">

    <div class="rose">🌹</div>

    <h1>Please Forgive Me, Yana</h1>

    <p class="message">
      I'm truly sorry.<br>
      I won't hurt you again.
    </p>

    <p class="question">
      Will you forgive me?
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No</button>
    </div>

    <div id="forgiven" class="forgiven">

      <div class="celebration">💗</div>

      <h2>Thank you, Yana ❤️</h2>

      <p>
        This little gift is for you,<br>
        because you deserve something sweet.
      </p>

      <div class="gifts">

        <div class="gift">
          <div class="bouquet">💐</div>
          <span>A bouquet of roses</span>
        </div>

        <div class="gift">
          <div class="chocolate">🍫</div>
          <span>A chocolate box</span>
        </div>

      </div>

      <p class="final-message">
        🌹 For you, digitally — with all my heart. 🍫
      </p>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
